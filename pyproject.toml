[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precedent"
version = "0.1.0"
description = "Row-level, removal-verified explanations for TabPFN-3.5 predictions, served over MCP."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "mcp>=1.2",
    "tabpfn>=9.0",
    "datasets",
]

[project.optional-dependencies]
dev = ["pytest"]
agent = ["langgraph", "langchain", "langchain-anthropic", "langsmith", "streamlit", "tomli; python_version < '3.11'"]

[project.scripts]
precedent-mcp = "precedent.server:main"
precedent-agent = "precedent.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
precedent = ["guardrails.toml"]
